services:
  app:
    build: .
    image: flavalon:latest
    container_name: flavalon
    environment:
      - PORT=5000
      - DATABASE_PATH=/data/flavalon.db
      - FLAG_PATH=/flag
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - BOT_ENABLED=1
      - BROWSER_PATH=/usr/bin/chromium
      - SELF_BASE_URL=http://127.0.0.1:5000
      # 平台会动态注入；本地测试用占位 flag
      - GZCTF_FLAG=flag{local_test_placeholder}
    ports:
      - "8080:5000"
    volumes:
      - flavalon-data:/data
    restart: unless-stopped

volumes:
  flavalon-data:
